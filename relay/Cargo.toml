[package]
name = "apeiron-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Blind relay: holds one-way ciphertext queues without knowing either the sender or the recipient."
# Not published to crates.io: this is part of the application, not a general-purpose
# library. It also guards against an accidental `cargo publish` of cryptographic
# code that is still in progress.
publish = false

[dependencies]
apeiron-core = { path = "../core" }

[lints.rust]
unsafe_code = "forbid"
