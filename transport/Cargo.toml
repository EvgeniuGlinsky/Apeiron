[package]
name = "apeiron-transport"
description = "Delivery without servers: envelopes in Mainline DHT (BEP 44). For now only the measurement that decides whether this works."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# Exact version: the DHT client is on the path of every message, and an update is a
# conscious step with its changelog read, as for vodozemac.
mainline = { version = "=8.0.0", default-features = false, features = ["node"] }
sha2.workspace = true
hex.workspace = true
getrandom.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
