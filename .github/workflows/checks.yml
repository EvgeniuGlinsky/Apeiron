# Mandatory checks.
#
# Until 23.09.2026 there were none at all, and that cost dearly: the build produced an APK
# without the native library and reported success. Collected here is what should
# catch such things before a human does.
#
# **Actions are pinned by SHA, not by tag.** A tag in someone else's repository can
# be moved to another commit, a SHA cannot. For a project that promises
# verifiability, trusting a movable label in someone else's hands is not acceptable.
# SHAs taken on 23.09.2026; when updating a version, take the new SHA, not the tag.

name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Exactly as many permissions as needed to read the sources.
permissions:
  contents: read

# A new push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust — format, lints, tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show

      - name: Format
        run: cargo fmt --all --check

      - name: Lints
        # `-D warnings`: a warning nobody looks at is not a
        # warning. In the core, unwrap/expect/panic are banned as well.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Lints for Android code
        # All JNI lives under cfg(target_os = "android") and is not checked
        # by a regular run at all: nobody compiles it on the development machine, and
        # an error in it is discovered only on the phone. Here it is free —
        # clippy checks, it does not link, and it needs no NDK: apeiron-platform
        # has no dependencies with C code.
        run: |
          rustup target add aarch64-linux-android
          cargo clippy --target aarch64-linux-android -p apeiron-platform -- -D warnings

      - name: Tests
        run: cargo test --workspace

  deps:
    name: Dependencies — vulnerabilities and licences
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install cargo-deny
        # Installed from source, not via a third-party action: one fewer
        # trusted foreign step in the chain.
        run: cargo install --locked cargo-deny

      - name: Check
        run: cargo deny check

  flutter:
    name: Flutter — analysis and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Analysis
        working-directory: app
        run: flutter analyze

      - name: Tests
        working-directory: app
        # Contact sheets (`*_sheet.dart`) are not included here: they are named without
        # the `_test` suffix deliberately, because they render PNGs and do not terminate.
        run: flutter test
