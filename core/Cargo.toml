[package]
name = "apeiron-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Messenger core: cryptography, storage, protocol. Contains no FFI."
# Not published to crates.io: this is part of the application, not a general-purpose
# library. It also guards against an accidental `cargo publish` of cryptographic
# code that is still in progress.
publish = false

[dependencies]
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
getrandom.workspace = true
zeroize.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
hex.workspace = true
vodozemac.workspace = true
hkdf.workspace = true
chacha20poly1305.workspace = true
serde_json.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# A panic in cryptographic code is a denial of service, and sometimes a leak.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"

# Tests only: the official RFC vectors are run directly against the crates
# we use; see core/tests/rfc_vectors.rs.
[dev-dependencies]
x25519-dalek.workspace = true
hkdf.workspace = true
chacha20poly1305.workspace = true
sha2.workspace = true
hex.workspace = true
