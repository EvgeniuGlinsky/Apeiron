# Тулчейн и цели сборки, зафиксированные в репозитории.
#
# `channel` намеренно не задан. Пин конкретной версии заставил бы rustup качать
# отдельный тулчейн даже там, где ровно эта версия уже стоит под именем stable,
# — гигабайт на ровном месте. Нижняя граница языка и так зафиксирована
# (`rust-version` в Cargo.toml воркспейса), а верхняя нам не нужна.
#
# Существенны здесь `targets` и `components`: без целей Android cargokit
# соберёт пустоту, а без rustfmt/clippy не пройдёт проверка в CI. Перечислены —
# значит rustup доставит их сам, а не через час выяснится, что их нет.
[toolchain]
components = ["rustfmt", "clippy"]
targets = [
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
    "i686-linux-android",
]
