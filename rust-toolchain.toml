# Toolchain and build targets, pinned in the repository.
#
# `channel` is deliberately not set. Pinning a specific version would make
# rustup download a separate toolchain even where exactly that version is
# already installed as stable — a gigabyte for nothing. The lower bound of the
# language is pinned anyway (`rust-version` in the workspace Cargo.toml), and
# we do not need an upper one.
#
# What matters here is `targets` and `components`: without the Android targets
# cargokit will build nothing, and without rustfmt/clippy the CI check will not
# pass. Listed means rustup delivers them itself, rather than it turning out an
# hour later that they are missing.
[toolchain]
components = ["rustfmt", "clippy"]
targets = [
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
    "i686-linux-android",
]
