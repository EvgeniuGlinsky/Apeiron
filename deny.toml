# Rules for `cargo deny check` — vulnerabilities, licences and growth of the
# dependency tree.
#
# Why this is here. The project promises verifiability, and every dependency is
# someone else's code that will end up in the APK and run next to the keys.
# We have few cryptographic dependencies and new ones will be added rarely,
# so it is cheaper to keep an allow-list and review each new name by hand
# than to one day find something abandoned with a known hole in the tree.

[graph]
# We check exactly the targets we build for — otherwise the report fills up with
# dependencies for platforms we do not go to.
targets = [
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
    "x86_64-pc-windows-msvc",
]
all-features = false

[advisories]
version = 2
# A yanked crate version is either a hole or a publishing mistake.
# Either one is a reason to stop.
yanked = "deny"
ignore = []

[licenses]
version = 2
# An allow-list, not a deny-list: an unknown licence must stop the build,
# not slip through.
#
# The list is trimmed to what is actually in the tree. Allowing licences
# "just in case" is pointless: the point of the check is that a new one appearing
# makes a person look at what crate arrived and from where.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # Our own workspace crates.
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.93

[bans]
# Two versions of one crate in the tree are usually the result of lazy updating,
# and in cryptography also a risk: only one of them will get the patch.
#
# Currently duplicated are `digest`, `block-buffer`, `crypto-common` and `syn`. The
# source is single and harmless: `flutter_rust_bridge_macros` pulls in an old-generation
# `md-5`, and this is a **procedural macro** — build-time code, it does not end up
# in the app. The app's cryptography meanwhile exists in a single copy, which
# was the goal.
multiple-versions = "warn"

# A dependency without a version is either an oversight or a path inside the
# workspace. We forbid the first and allow the second: `apeiron-core` is included
# by path deliberately, it has no separate version and should not have one.
wildcards = "deny"
allow-wildcard-paths = true
# The lists below are empty deliberately: there is nothing to ban by name yet, but a
# place to record "we deliberately do not take this crate" must exist.
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
