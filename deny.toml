# Правила для `cargo deny check` — уязвимости, лицензии и разрастание дерева
# зависимостей.
#
# Зачем это здесь. Проект обещает проверяемость, а всякая зависимость — это
# чужой код, который попадёт в APK и будет выполняться рядом с ключами.
# Криптографических зависимостей у нас немного и добавляться они будут редко,
# поэтому дешевле держать белый список и разбирать каждое новое имя руками,
# чем однажды обнаружить в дереве что-нибудь заброшенное с известной дырой.

[graph]
# Проверяем ровно те цели, под которые собираем, — иначе в отчёт лезут
# зависимости для платформ, куда мы не ходим.
targets = [
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
    "x86_64-pc-windows-msvc",
]
all-features = false

[advisories]
version = 2
# Отозванная версия крейта — это либо дыра, либо ошибка публикации.
# И то и другое повод остановиться.
yanked = "deny"
ignore = []

[licenses]
version = 2
# Белый список, а не чёрный: неизвестная лицензия должна останавливать сборку,
# а не проскакивать.
#
# Список подрезан до того, что в дереве действительно есть. Разрешать лицензии
# «на всякий случай» бессмысленно: смысл проверки в том, чтобы появление новой
# заставило человека посмотреть, что за крейт пришёл и откуда.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # Наши собственные крейты воркспейса.
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.93

[bans]
# Две версии одного крейта в дереве — обычно следствие ленивого обновления,
# а в криптографии ещё и риск: заплатку получит одна из них.
#
# Сейчас задвоены `digest`, `block-buffer`, `crypto-common` и `syn`. Источник
# один и безобидный: `flutter_rust_bridge_macros` тянет `md-5` старого
# поколения, и это **процедурный макрос** — код времени сборки, в приложение
# он не попадает. Криптография приложения при этом в одном экземпляре, что
# и было целью.
multiple-versions = "warn"

# Зависимость без указания версии — это либо недосмотр, либо путь внутри
# воркспейса. Первое запрещаем, второе разрешаем: `apeiron-core` подключается
# по пути намеренно, отдельной версии у него нет и не должно быть.
wildcards = "deny"
allow-wildcard-paths = true
# Списки ниже пусты намеренно: пока запрещать нечего поимённо, но место
# для записи «этот крейт мы осознанно не берём» должно существовать.
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
