[package]
name = "apeiron-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Access to the platform's hardware key store. One JNI call, Android only."
publish = false

[dependencies]
zeroize.workspace = true
thiserror.workspace = true

# Android only. Otherwise jni would also end up in the Windows build, which is declared
# in the [graph] targets of deny.toml.
[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true

[lints.rust]
# Not forbid: there is no JNI without unsafe. Every exemption is named and has an
# explanation on the spot; their list is kept in src/lib.rs.
unsafe_code = "deny"

[lints.clippy]
# In release panic = "abort": a panic here is instant death of the process without
# a single word in the log. So everything that panics is forbidden, including
# indexing and truncation in type casts.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
cast_possible_truncation = "deny"
arithmetic_side_effects = "warn"
