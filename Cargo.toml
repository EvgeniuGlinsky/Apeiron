[workspace]
resolver = "2"
members = ["core", "relay", "app/rust"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
# Версии подобраны **под то же поколение, что у vodozemac**. Иначе в бинаре
# оказываются две независимые реализации X25519 и Ed25519 сразу: вдвое больше
# кода рядом с ключами, вдвое больше обязанностей по обновлению и вечный вопрос
# «а в какую из них приехала заплатка». Проверяется `cargo deny check`
# (multiple-versions) — при следующем расхождении он это назовёт.
ed25519-dalek = { version = "3", features = ["rand_core", "zeroize"] }
x25519-dalek = { version = "3", features = ["static_secrets", "zeroize"] }
# Случайность берётся прямо у операционной системы. `rand`/`rand_core` для
# этого больше не нужны: в 0.10 источник ОС из них вынесен, а промежуточный
# слой абстракций над «дай N случайных байт» нам и не был нужен.
getrandom = "0.4"
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.11"
subtle = "2"
thiserror = "2"
hex = "0.4"

# Двойной храповик Olm. Версия закреплена точно: криптографическую зависимость
# нельзя обновлять «само собой» — обновление должно быть осознанным действием
# с чтением журнала изменений. Обоснование выбора и разбор известных замечаний
# к vodozemac — решение R-009 в docs/threat-log.md.
vodozemac = "=0.11.0"

# Вывод ключей и AEAD для локального хранения. Оба — общепринятые реализации
# соответствующих RFC; свои примитивы не пишем (§18 исследования).
hkdf = "0.13"
chacha20poly1305 = "0.11"

# Сборка с отладочной информацией, но без переполнения диска C: —
# target/ создаётся рядом с проектом; см. .cargo/config.toml
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
