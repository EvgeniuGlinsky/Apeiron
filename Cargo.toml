[workspace]
resolver = "2"
members = ["core", "store", "platform", "relay", "app/rust"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
# Версии подобраны **под то же поколение, что у vodozemac**. Иначе в бинаре
# оказываются две независимые реализации X25519 и Ed25519 сразу: вдвое больше
# кода рядом с ключами, вдвое больше обязанностей по обновлению и вечный вопрос
# «а в какую из них приехала заплатка». Проверяется `cargo deny check`
# (multiple-versions) — при следующем расхождении он это назовёт.
ed25519-dalek = { version = "3", features = ["rand_core", "zeroize"] }
x25519-dalek = { version = "3", features = ["static_secrets", "zeroize"] }
# Случайность берётся прямо у операционной системы. `rand`/`rand_core` для
# этого больше не нужны: в 0.10 источник ОС из них вынесен, а промежуточный
# слой абстракций над «дай N случайных байт» нам и не был нужен.
getrandom = "0.4"
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.11"
subtle = "2"
thiserror = "2"
hex = "0.4"

# Двойной храповик Olm. Версия закреплена точно: криптографическую зависимость
# нельзя обновлять «само собой» — обновление должно быть осознанным действием
# с чтением журнала изменений. Обоснование выбора и разбор известных замечаний
# к vodozemac — решение R-009 в docs/threat-log.md.
vodozemac = "=0.11.0"

# Вывод ключей и AEAD для локального хранения. Оба — общепринятые реализации
# соответствующих RFC; свои примитивы не пишем (§18 исследования).
hkdf = "0.13"
chacha20poly1305 = "0.11"

# Локальная база. SQLite, а не своя раскладка файлов: состояние храповика и
# запись о сообщении обязаны попадать на диск одной транзакцией, иначе после
# внезапного выключения телефона часть сообщений становится нечитаемой навсегда.
# Своего движка хранения не пишем по той же причине, по которой не пишем своих
# примитивов шифрования.
#
# `bundled` компилирует SQLite из исходников — cargokit выставляет CC_/AR_/
# RANLIB_/CFLAGS_ для каждой цели Android, поэтому C-код собирается штатно.
# SQLCipher не берём: шифруем сами, записями, своим AEAD — так криптостек
# остаётся одного поколения, а запись оказывается привязана к своему месту
# в базе (см. docs/storage.md).
rusqlite = { version = "0.40", features = ["bundled"] }

# Сериализация состояния vodozemac (AccountPickle/SessionPickle). Оба типа
# объявлены как Serialize/Deserialize, своего канонического вида у них нет,
# а подписывать их не нужно — поэтому годится serde_json. Обе зависимости уже
# были в дереве транзитивно через vodozemac, белый список лицензий не меняется.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# JNI. Подключается ТОЛЬКО под Android (см. platform/Cargo.toml) и закреплён
# точной версией по той же причине, что vodozemac: это код рядом с мастер-ключом,
# и обновление обязано быть осознанным действием. Фичу `invocation` включать
# нельзя никогда — она тянет java-locator и линкуется с libjvm.
jni = { version = "=0.22.4", default-features = false }

# Сборка с отладочной информацией, но без переполнения диска C: —
# target/ создаётся рядом с проектом; см. .cargo/config.toml
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
