[workspace]
resolver = "2"
members = ["core", "relay", "app/rust"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
rand = "0.8"
rand_core = "0.6"
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.10"
subtle = "2"
thiserror = "2"
hex = "0.4"

# Сборка с отладочной информацией, но без переполнения диска C: —
# target/ живёт в <каталог исследования>
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
