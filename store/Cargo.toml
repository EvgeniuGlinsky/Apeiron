[package]
name = "apeiron-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local storage under AEAD: key hierarchy, schema, sealing of records."
publish = false

[dependencies]
apeiron-core = { path = "../core" }
apeiron-platform = { path = "../platform" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
thiserror.workspace = true
hex.workspace = true

[features]
# A test source of the master key for tests on the host. It must not get into a device
# build; see compile_error! in src/testing.rs.
testing = []

[dev-dependencies]
apeiron-store = { path = ".", features = ["testing"] }
tempfile = "3"
rusqlite.workspace = true

[lints.rust]
# There is not and will not be a single unsafe here: everything that requires JNI lives in
# apeiron-platform, and arrives here as ready-made bytes.
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
