[package]
name = "apeiron-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Локальное хранилище под AEAD: иерархия ключей, схема, запечатывание записей."
publish = false

[dependencies]
apeiron-core = { path = "../core" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
thiserror.workspace = true
hex.workspace = true

[features]
# Подставной источник мастер-ключа для тестов на хосте. В сборку для устройства
# попасть не должен — см. compile_error! в src/testing.rs.
testing = []

[dev-dependencies]
apeiron-store = { path = ".", features = ["testing"] }
tempfile = "3"

[lints.rust]
# Здесь нет и не будет ни одного unsafe: всё, что требует JNI, живёт в
# apeiron-platform, а сюда приходит уже готовыми байтами.
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
