[package]
name = "rust_lib_apeiron"
# Inherited from the workspace, like the other crates. Without `license` the crate
# goes to the public repository undeclared; `cargo deny check` caught this.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bridge between Flutter and the core. Thin by design: no logic here, only transport over FFI."
# Not published to crates.io: this is part of the application, not a general-
# purpose library. It also blocks an accidental `cargo publish` of cryptographic
# code that is still in progress.
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
apeiron-core = { path = "../../core" }
apeiron-store = { path = "../../store" }
apeiron-platform = { path = "../../platform" }
apeiron-transport = { path = "../../transport" }
hex = "0.4"
zeroize.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
# The bridge is code on the FFI boundary. A panic here is caught by nothing and
# takes down the whole application process, so the bans are the same as in the core.
#
# `deny`, not `forbid` as in the core: FFI does not exist without `unsafe`, and
# the generated bridge needs it by nature. `forbid` cannot be lifted locally
# even deliberately, `deny` can, and in exactly one place: on the declaration
# `mod frb_generated` in `src/lib.rs`, with an explanation. All the code we
# write ourselves stays free of `unsafe`.
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
