# -Dfile.encoding=UTF-8: without it the messages of our build guards arrive
# in the console in the system encoding (cp866 on this machine) and turn into garbage.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
