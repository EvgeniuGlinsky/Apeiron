# -Dfile.encoding=UTF-8: без него сообщения наших предохранителей приезжают
# в консоль в кодировке системы (cp866 на этой машине) и превращаются в мусор.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
